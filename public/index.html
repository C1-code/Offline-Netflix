<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offlineflix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div id="logo" title="Offlineflix">OFFLINEFLIX</div>
  <div id="navback" hidden>&#8592; Back</div>
  <div class="spacer"></div>
  <div id="searchwrap"><input id="search" placeholder="Search" autocomplete="off" spellcheck="false"></div>
  <div id="btn-settings" title="Settings">&#9881;</div>
</header>

<main id="view"></main>

<div id="player" hidden>
  <video id="video"></video>
  <div id="subsbox" class="sub-md"></div>
  <div id="nowplaying"></div>
  <div id="subsflash"></div>
  <div id="dbgbox" hidden></div>
  <div id="subsflash"></div>
  <div id="controls">
    <div id="seekwrap">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    </div>
    <div id="ctlrow">
      <button id="btn-back" class="ctl" title="Back (Esc)">&#8592;</button>
      <button id="btn-play" class="ctl" title="Play/Pause (Space)">&#9654;</button>
      <button id="btn-next" class="ctl" title="Next episode (N)" hidden>&#9197;</button>
      <span id="timecur">0:00</span>
      <span class="grow"></span>
      <button id="btn-mute" class="ctl" title="Mute (M)">&#128266;</button>
      <input id="vol" type="range" min="0" max="100" value="100" title="Volume">
      <button id="btn-subs" class="ctl" title="Subtitles (C)">CC</button>
      <span id="speedbtns"></span>
      <button id="btn-eps" class="ctl" title="Episodes">&#9776;</button>
      <button id="btn-fs" class="ctl" title="Fullscreen (F)">&#x26F6;</button>
      <span id="timetot">0:00</span>
    </div>
  </div>
  <div id="subsmenu" hidden></div>
  <div id="epspanel" hidden></div>
  <div id="nextoverlay" hidden>
    <div id="nextbox">
      <div id="nextlabel">Up next</div>
      <div id="nextname"></div>
      <button id="btn-startnext" class="bigbtn">Play now</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
